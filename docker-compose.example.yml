name: mysagra

services:
  mysagra-backend:
    image: ghcr.io/mysagra/mysagra-backend:latest
    container_name: mysagra-api
    env_file: .env
    ports:
      - "4300:4300"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=mysql://${DB_USER:-mysagra}:${DB_USER_PASSWORD:-mysagra}@db:3306/${MYSQL_DATABASE:-mysagra}
      - JWT_SECRET=${JWT_SECRET}
      - PEPPER=${PEPPER}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - MIGRATE_ON_START=true
      - TRUST_PROXY_LEVEL=${TRUST_PROXY_LEVEL:-2}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4300/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - api_logs:/app/logs
      - api_public:/app/public
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mysagra-network

  db:
    image: mysql:latest
    container_name: db
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: "${MYSQL_DATABASE:-mysagra}"
      MYSQL_USER: "${DB_USER:-mysagra}"
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-mysagra}
    volumes:
      - mysql_data:/var/lib/mysql:delegated
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    security_opt:
      - seccomp=unconfined
    user: mysql
    networks:
      - mysagra-network

  mycassa:
    image: ghcr.io/mysagra/mysagra-mycassa:latest
    container_name: mycassa
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - AUTH_URL=${AUTH_URL_CASSA}
      - NODE_EXTRA_CA_CERTS=/app/rootCA.pem
      - REQUIRE_TABLE=${REQUIRE_TABLE}
    depends_on:
      mysagra-backend:
        condition: service_healthy
    volumes:
      - ./rootCA.pem:/app/rootCA.pem:ro
    networks:
      - mysagra-network
    ports:
      - "80:3031"

  myamministratore:
    image: ghcr.io/mysagra/mysagra-myamministratore:latest
    container_name: myamministratore
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - AUTH_URL=${AUTH_URL_AMMINISTRATORE}
      - NODE_EXTRA_CA_CERTS=/app/rootCA.pem
    volumes:
      - ./rootCA.pem:/app/rootCA.pem:ro
    depends_on:
      mysagra-backend:
        condition: service_healthy
    networks:
      - mysagra-network
    ports:
      - "81:3000"

  mystampa:
    image: ghcr.io/mysagra/mysagra-mystampa:latest
    container_name: mystampa
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - API_KEY=${MYSTAMPA_API_KEY}
      - API_URL=${API_URL}
    volumes:
      - ./assets:/app/assets
      - mystampa_config:/app/data
    depends_on:
      mysagra-backend:
        condition: service_healthy
    networks:
      - mysagra-network
    ports:
      - "3032:3032"

  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASS}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - mysagra-network

  mynumeri:
    image: ghcr.io/mysagra/mysagra-mynumeri:latest
    container_name: mynumeri
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - AUTH_URL=${AUTH_URL_NUMERI}
      - NODE_EXTRA_CA_CERTS=/app/rootCA.pem
    depends_on:
      mysagra-backend:
        condition: service_healthy
    volumes:
      - ./rootCA.pem:/app/rootCA.pem:ro
      - mynumeri_data:/app/data
    networks:
      - mysagra-network
    ports:
      - "3033:3033"

  myclienti:
    image: ghcr.io/mysagra/mysagra-myclienti:latest
    container_name: myclienti
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - CLIENTI_API_KEY=${MYCLIENTI_API_KEY}
      - REQUIRE_TABLE=${REQUIRE_TABLE}
      - NODE_EXTRA_CA_CERTS=/app/rootCA.pem
    depends_on:
      mysagra-backend:
        condition: service_healthy
    volumes:
      - ./rootCA.pem:/app/rootCA.pem:ro
    networks:
      - mysagra-network
    ports:
      - "3034:3034"

  dbgate:
    image: dbgate/dbgate:latest
    container_name: mysagra-dbgate
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - LOGIN=${DBGATE_USER}
      - PASSWORD=${DBGATE_PASSWORD}
      - CONNECTIONS=con1
      - ENGINE_con1=mysql@dbgate-plugin-mysql
      - SERVER_con1=db
      - PORT_con1=3306
      - USER_con1=${DB_USER:-mysagra}
      - PASSWORD_con1=${DB_USER_PASSWORD}
      - DATABASE_con1=${MYSQL_DATABASE:-mysagra}
    networks:
      - mysagra-network

volumes:
  api_logs:
    driver: local
  api_public:
    driver: local
  mysql_data:
    driver: local
  mystampa_config:
    driver: local
  redis_data:
    driver: local
  mynumeri_data:
    driver: local

networks:
  mysagra-network:
    driver: bridge
