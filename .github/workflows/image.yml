name: image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "installer/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mywizard

jobs:
  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: installer
          file: installer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image smoke test
        run: |
          set -eux
          out="$(mktemp -d)"
          chmod 777 "$out"
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm "$image" --version
          docker run --rm -v "$out":/out -u "$(id -u):$(id -g)" -e HOME=/tmp "$image" \
            --non-interactive --mode lan --server-ip 192.168.1.100 --services all
          test -s "$out/docker-compose.yml"
          docker compose -f "$out/docker-compose.yml" --env-file "$out/.env" config -q
